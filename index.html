<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOT 연구소</title>
  <meta name="description" content="Research Institute of Data Economy and Innovation — Dataset Factory for Innovation, Entrepreneurship and Entrepreneurial Ecosystem">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Noto Sans KR', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            sg: {
              50: '#fef2f2',
              100: '#fde8e8',
              200: '#f5c6c6',
              300: '#e89898',
              400: '#d45a5a',
              500: '#B60005',
              600: '#930E14',
              700: '#73170D',
              800: '#5a120a',
              900: '#3d0c07',
            },
            accent: {
              50: '#fef2f2',
              100: '#fde8e8',
              200: '#f5c6c6',
              400: '#e57373',
              500: '#B60005',
              600: '#930E14',
            },
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="styles/globals.css?v=20261008-conf7">
</head>
<body class="font-sans text-gray-800 bg-white antialiased">

  <!-- Top Utility Bar (Sogang University MOT Style) -->
  <div class="hidden sm:block border-b border-gray-100 bg-white text-xs text-gray-500 py-1.5">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-end items-center gap-3">
      <a href="https://sgmot.sogang.ac.kr" target="_blank" rel="noopener noreferrer" class="hover:text-sg-700 transition-colors">서강대학교 MOT대학원</a>
      <span class="text-gray-300">|</span>
      <a href="https://www.sogang.ac.kr" target="_blank" rel="noopener noreferrer" class="hover:text-sg-700 transition-colors">서강대학교</a>
      <span class="text-gray-300">|</span>
      <span class="text-gray-600 font-medium">데이터 경제 및 혁신 연구소 (DEIL)</span>
    </div>
  </div>

  <!-- Header -->
  <header id="header" class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-gray-100 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 sm:h-18">
        <!-- Sogang Logo with Sub-title -->
        <a href="#home" class="flex items-center gap-2.5 sm:gap-3 group">
          <img src="images/sogang-logo.png" alt="서강대학교" class="h-8 sm:h-9.5 w-auto object-contain">
          <div class="border-l border-gray-300 pl-2.5 sm:pl-3 py-0.5">
            <span class="block text-xs sm:text-sm font-bold text-gray-900 tracking-tight leading-tight group-hover:text-sg-700 transition-colors">데이터 경제 및 혁신 연구소</span>
            <span class="block text-[10px] sm:text-[11px] text-gray-500 font-medium tracking-tighter uppercase leading-tight">Data Economy & Innovation Lab</span>
          </div>
        </a>

        <!-- Desktop Nav -->
        <nav id="desktop-nav" class="hidden lg:flex items-center gap-1.5">
        </nav>

        <!-- Right: Lang Toggle + Mobile Menu -->
        <div class="flex items-center gap-2 sm:gap-3">
          <!-- Language Toggle -->
          <div id="lang-toggle" class="flex items-center bg-gray-100 rounded-full p-0.5">
            <button onclick="setLang('ko')" id="lang-ko" class="px-2.5 sm:px-3 py-1 text-xs font-semibold rounded-full transition-all">KR</button>
            <button onclick="setLang('en')" id="lang-en" class="px-2.5 sm:px-3 py-1 text-xs font-semibold rounded-full transition-all">EN</button>
          </div>

          <!-- Mobile Menu Button -->
          <button id="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="메뉴 열기/닫기" class="lg:hidden p-2 text-gray-700 hover:text-sg-600 rounded-lg hover:bg-gray-100 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path id="menu-icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Mobile Nav -->
      <nav id="mobile-nav" class="lg:hidden hidden py-3 border-t border-gray-100 space-y-1">
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <!-- Hero Section -->
    <section id="home" class="relative overflow-hidden min-h-[480px] sm:h-[460px] flex items-center py-16 sm:py-0">
      <!-- Campus Background Image -->
      <div class="absolute inset-0">
        <img src="images/campus.jpg" alt="서강대학교 캠퍼스" class="w-full h-full object-cover object-center sm:object-right">
      </div>
      <!-- Responsive Overlay — Warm official burgundy (#73170D) gradient -->
      <div class="absolute inset-0 hero-overlay"></div>
      <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full flex items-center">
        <div class="max-w-2xl py-4 sm:py-0">
          <p class="text-xs sm:text-sm font-semibold tracking-wider text-rose-200/90 uppercase mb-2">Sogang University MOT</p>
          <h1 id="hero-lab-name" class="text-2xl sm:text-4xl lg:text-[2.75rem] font-bold text-white mb-4 sm:mb-5 leading-tight break-keep"></h1>
          <p id="hero-main-copy" class="text-base sm:text-lg text-gray-100 mb-3 sm:mb-4 font-medium break-keep"></p>
          <p id="hero-sub-copy" class="text-sm sm:text-base text-gray-200/90 mb-6 sm:mb-8 leading-relaxed break-keep"></p>
          <div class="flex flex-col sm:flex-row gap-3 sm:gap-4">
            <a href="#about" id="hero-cta1" class="w-full sm:w-auto text-center px-6 py-3 bg-white text-sg-700 font-semibold rounded-lg hover:bg-gray-50 transition-all shadow-md hover:shadow-lg active:scale-[0.98]"></a>
            <a href="#contact" id="hero-cta2" class="w-full sm:w-auto text-center px-6 py-3 border border-white/50 text-white font-semibold rounded-lg hover:bg-white/15 transition-all active:scale-[0.98]"></a>
          </div>
        </div>
      </div>
    </section>

    <!-- About Section -->
    <section id="about" class="py-14 sm:py-24 lg:py-32 bg-white grid-pattern relative">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
        <div id="about-content"></div>
      </div>
    </section>

    <!-- Section Divider -->
    <div class="section-divider"></div>

    <!-- Projects -->
    <section id="projects" class="py-14 sm:py-24 lg:py-32 bg-white">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div id="projects-content"></div>
      </div>
    </section>

    <!-- Data Infrastructure -->
    <section id="data-infra" class="py-14 sm:py-24 lg:py-32 relative overflow-hidden" style="background: linear-gradient(135deg, #3d0a06 0%, #1a0503 40%, #0a0202 100%);">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
        <div id="data-infra-content"></div>
      </div>
    </section>

    <!-- People -->
    <section id="people" class="py-14 sm:py-24 lg:py-32 bg-white">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div id="people-content"></div>
      </div>
    </section>

    <!-- Section Divider -->
    <div class="section-divider"></div>

    <!-- Alumni / Student Placement -->
    <section id="alumni" class="py-14 sm:py-24 lg:py-32" style="background: linear-gradient(180deg, #fafaf9 0%, #f5f5f0 100%);">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div id="alumni-content"></div>
      </div>
    </section>

    <!-- Contact -->
    <section id="contact" class="py-14 sm:py-24 lg:py-32 bg-white grid-pattern relative">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
        <div id="contact-content"></div>
      </div>
    </section>
  </main>

  <!-- Media Modal (Video & Poster Lightbox) -->
  <div id="media-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 sm:p-6 transition-all duration-300" onclick="handleModalBackdropClick(event)">
    <div class="relative bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden shadow-2xl flex flex-col" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-5 py-3.5 border-b border-gray-100 bg-gray-50/80">
        <h3 id="modal-title" class="font-bold text-gray-900 text-sm sm:text-base truncate pr-4"></h3>
        <button onclick="closeMediaModal()" class="text-gray-400 hover:text-gray-700 p-1.5 rounded-lg hover:bg-gray-100 transition-colors" aria-label="닫기">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modal-body" class="overflow-y-auto flex-1 flex items-center justify-center bg-gray-950 p-2 sm:p-4">
        <!-- Injected dynamically: image or video -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-sg-900 text-gray-400 py-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <p id="footer-copy" class="text-sm"></p>
    </div>
  </footer>

  <script src="data/content.js?v=20261008-conf8"></script>
  <script src="js/app.js?v=20261008-conf8"></script>
</body>
</html>
