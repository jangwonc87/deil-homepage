<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOT 연구소</title>
  <meta name="description" content="Research Institute of Data Economy and Innovation — Dataset Factory for Innovation, Entrepreneurship and Entrepreneurial Ecosystem">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Noto Sans KR', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            sg: {
              50: '#fef2f2',
              100: '#fde8e8',
              200: '#f5c6c6',
              300: '#e89898',
              400: '#d45a5a',
              500: '#B60005',
              600: '#930E14',
              700: '#73160d',
              800: '#5a1009',
              900: '#3d0a06',
            },
            accent: {
              50: '#fef2f2',
              100: '#fde8e8',
              200: '#f5c6c6',
              400: '#e57373',
              500: '#B60005',
              600: '#930E14',
            },
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="styles/globals.css?v=20260907">
</head>
<body class="font-sans text-gray-800 bg-white antialiased">

  <!-- Demo Banner -->
  <div id="demo-banner" style="background-color: #73160d;" class="text-white text-center text-xs py-1.5 tracking-wide"></div>

  <!-- Header -->
  <header id="header" class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-gray-100 shadow-sm" style="border-top: 2px solid #B60005;">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Sogang Logo -->
        <a href="#home" class="flex items-center group">
          <img src="images/sogang-logo.png" alt="서강대학교" class="h-8 sm:h-9">
        </a>

        <!-- Desktop Nav -->
        <nav id="desktop-nav" class="hidden lg:flex items-center gap-1">
        </nav>

        <!-- Right: Lang Toggle + Mobile Menu -->
        <div class="flex items-center gap-3">
          <!-- Language Toggle -->
          <div id="lang-toggle" class="flex items-center bg-gray-100 rounded-full p-0.5">
            <button onclick="setLang('ko')" id="lang-ko" class="px-3 py-1 text-xs font-medium rounded-full transition-all">KR</button>
            <button onclick="setLang('en')" id="lang-en" class="px-3 py-1 text-xs font-medium rounded-full transition-all">EN</button>
          </div>

          <!-- Mobile Menu Button -->
          <button id="mobile-menu-btn" onclick="toggleMobileMenu()" class="lg:hidden p-2 text-gray-600 hover:text-sg-600 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path id="menu-icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Mobile Nav -->
      <nav id="mobile-nav" class="lg:hidden hidden pb-4 border-t border-gray-100 pt-4">
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <!-- Hero Section -->
    <section id="home" class="relative overflow-hidden h-[450px]">
      <!-- Campus Background Image -->
      <div class="absolute inset-0">
        <img src="images/campus.jpg" alt="서강대학교 캠퍼스" class="w-full h-full object-cover">
      </div>
      <!-- Dark Overlay — matching MOT site color, covering ~40% left -->
      <div class="absolute inset-0" style="background: linear-gradient(to right, rgba(112,0,3,0.85) 0%, rgba(112,0,3,0.78) 30%, rgba(112,0,3,0.3) 42%, transparent 55%);"></div>
      <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full flex items-center">
        <div class="max-w-2xl">
          <h1 id="hero-lab-name" class="text-3xl sm:text-4xl lg:text-[2.75rem] font-bold text-white mb-6 leading-tight"></h1>
          <p id="hero-main-copy" class="text-lg sm:text-xl text-gray-200 mb-4 font-medium"></p>
          <p id="hero-sub-copy" class="text-base text-gray-300/80 mb-8 leading-relaxed"></p>
          <div class="flex flex-wrap gap-4">
            <a href="#research" id="hero-cta1" class="px-6 py-3 bg-white text-sg-700 font-semibold rounded-lg hover:bg-sg-50 transition-all shadow-lg hover:shadow-xl"></a>
            <a href="#contact" id="hero-cta2" class="px-6 py-3 border-2 border-white/30 text-white font-semibold rounded-lg hover:bg-white/10 transition-all"></a>
          </div>
        </div>
      </div>
    </section>

    <!-- About Section -->
    <section id="about" class="py-20 sm:py-28 bg-white">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div id="about-content"></div>
      </div>
    </section>



    <!-- Projects -->
    <section id="projects" class="py-20 sm:py-28 bg-white">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div id="projects-content"></div>
      </div>
    </section>

    <!-- Data Infrastructure -->
    <section id="data-infra" class="py-20 sm:py-28 bg-sg-800">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div id="data-infra-content"></div>
      </div>
    </section>

    <!-- People -->
    <section id="people" class="py-20 sm:py-28 bg-white">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div id="people-content"></div>
      </div>
    </section>

    <!-- Alumni / Student Placement -->
    <section id="alumni" class="py-20 sm:py-28 bg-sg-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div id="alumni-content"></div>
      </div>
    </section>







    <!-- Contact -->
    <section id="contact" class="py-20 sm:py-28 bg-gray-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div id="contact-content"></div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-sg-900 text-gray-400 py-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <p id="footer-demo" class="text-xs mb-2 text-gray-500"></p>
      <p id="footer-copy" class="text-sm"></p>
    </div>
  </footer>

  <script src="data/content.js?v=20260907"></script>
  <script src="js/app.js?v=20260907"></script>
</body>
</html>
